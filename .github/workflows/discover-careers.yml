name: Find company careers pages

# Run by hand from the Actions tab after editing companies.json, or every
# month or two to pick up companies that changed hiring system.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python discover_careers.py

      - name: Save results
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add careers-map.json careers-discovery.md
          git diff --staged --quiet || git commit -m "careers: refresh company map"
          git pull --rebase
          git push
